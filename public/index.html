<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Personal Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✨ User Personal Details</h1>

        <form id="userForm">

            <!-- Full Name -->
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
            <span id="nameError" class="error"></span>


            <!-- Email -->
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            <span id="emailError" class="error"></span>


            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
            <span id="phoneError" class="error"></span>


            <!-- Date of Birth -->
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
            <span id="dobError" class="error"></span>


            <!-- Gender -->
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <span id="genderError" class="error"></span>


            <!-- Blood Group -->
            <label for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" name="bloodGroup">
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <span id="bloodGroupError" class="error"></span>


            <!-- Address -->
            <label for="address">Address</label>
            <textarea id="address" name="address" placeholder="Enter your address"></textarea>
            <span id="addressError" class="error"></span>


            <!-- City -->
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter your city">
            <span id="cityError" class="error"></span>


            <!-- State -->
            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="Enter your state">
            <span id="stateError" class="error"></span>


            <!-- Pincode -->
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" placeholder="Enter 6-digit pincode">
            <span id="pincodeError" class="error"></span>


            <!-- Buttons -->
           <div class="buttons">
    <button type="submit">💾 Save Details</button>
    <button type="reset">🔄 Clear</button>
</div>

<div class="view-users">
    <button type="button" id="viewUsersButton" onclick="window.location.href='/users.html'">
        👥 View Saved Users
    </button>
</div>


    <!-- SUCCESS POPUP -->
    <div id="successModal" class="modal">

        <div class="modal-content">

            <div class="success-icon">✓</div>

            <h2>Success!</h2>

            <p>User details saved successfully!</p>

            <button id="successOkButton">OK</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
